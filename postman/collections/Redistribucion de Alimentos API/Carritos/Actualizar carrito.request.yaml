$kind: http-request
url: "{{baseUrl}}/carritos/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "{{idPrueba}}"
body:
  type: json
  content: |-
    {
      "estado": "activo",
      "id_usuario": "1",
      "fecha_creacion": "2026-01-15"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });
    language: text/javascript
order: 4000
