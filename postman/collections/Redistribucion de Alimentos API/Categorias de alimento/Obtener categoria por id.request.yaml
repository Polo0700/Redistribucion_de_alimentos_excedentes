$kind: http-request
url: "{{baseUrl}}/categorias/:id"
method: GET
pathVariables:
  id: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 con el registro en 'categoria', o 404 con message", function () {
          var body = pm.response.json();
          if (pm.response.code === 200) {
              pm.expect(body).to.have.property('categoria');
          } else {
              pm.response.to.have.status(404);
              pm.expect(body).to.have.property('message');
          }
      });
    language: text/javascript
order: 2000
