$kind: http-request
url: "{{baseUrl}}/donaciones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Devuelve la lista paginada en 'donaciones'", function () {
          pm.expect(pm.response.json()).to.have.property('donaciones');
      });
    language: text/javascript
order: 1000
