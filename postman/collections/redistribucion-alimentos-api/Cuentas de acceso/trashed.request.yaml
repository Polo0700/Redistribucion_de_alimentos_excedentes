$kind: http-request
name: 'Listar cuentas de acceso eliminadas (papelera)'
method: GET
url: '{{baseUrl}}/cuentas/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'cuentas'", function () {
          pm.expect(pm.response.json()).to.have.property('cuentas');
      });