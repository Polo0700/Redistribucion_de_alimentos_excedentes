$kind: http-request
name: 'Actualizar solicitud'
method: PUT
url: '{{baseUrl}}/solicitudes/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "id_usuario": 1,
        "fecha_solicitud": "2026-01-01",
        "estado": "pendiente",
        "direccion_entrega": "Direccion de prueba",
        "observaciones": "Creada por la coleccion de pruebas"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });