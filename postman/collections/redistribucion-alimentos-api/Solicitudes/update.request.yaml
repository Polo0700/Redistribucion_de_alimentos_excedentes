$kind: http-request
name: 'Actualizar solicitud'
method: PUT
url: '{{baseUrl}}/solicitudes/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fecha_solicitud": "2026-01-15",
      "observaciones": "Creada por la coleccion de pruebas",
      "estado": "pendiente",
      "id_usuario": "1",
      "direccion_entrega": "Calle Falsa 123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });