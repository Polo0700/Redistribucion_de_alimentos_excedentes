$kind: http-request
name: 'Listar solicitudes'
method: GET
url: '{{baseUrl}}/solicitudes'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la lista paginada en 'solicitudes'", function () {
          pm.expect(pm.response.json()).to.have.property('solicitudes');
      });