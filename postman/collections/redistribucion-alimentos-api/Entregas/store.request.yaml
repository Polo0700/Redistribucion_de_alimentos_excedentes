$kind: http-request
name: 'Crear entrega'
method: POST
url: '{{baseUrl}}/entregas'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "id_solicitud": 1,
        "fecha_entrega": "2026-01-01",
        "responsable": "Responsable de prueba",
        "estado": "entregada",
        "observaciones": "Creada por la coleccion de pruebas"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });