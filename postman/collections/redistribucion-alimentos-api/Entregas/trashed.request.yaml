$kind: http-request
name: 'Listar entregas eliminadas (papelera)'
method: GET
url: '{{baseUrl}}/entregas/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'entregas'", function () {
          pm.expect(pm.response.json()).to.have.property('entregas');
      });