$kind: http-request
name: 'Actualizar entrega'
method: PUT
url: '{{baseUrl}}/entregas/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fecha_entrega": "2026-01-20",
      "estado": "programada",
      "responsable": "Repartidor de prueba",
      "observaciones": "Creada por la coleccion de pruebas",
      "id_solicitud": "1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });