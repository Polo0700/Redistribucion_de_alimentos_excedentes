$kind: http-request
name: 'Listar donaciones eliminadas (papelera)'
method: GET
url: '{{baseUrl}}/donaciones/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'donaciones'", function () {
          pm.expect(pm.response.json()).to.have.property('donaciones');
      });