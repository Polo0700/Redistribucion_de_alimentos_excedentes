$kind: http-request
name: 'Eliminar donacion (borrado logico)'
method: DELETE
url: '{{baseUrl}}/donaciones/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });