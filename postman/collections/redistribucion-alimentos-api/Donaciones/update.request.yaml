$kind: http-request
name: 'Actualizar donacion'
method: PUT
url: '{{baseUrl}}/donaciones/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "id_usuario": 1,
        "fecha_donacion": "2026-01-01",
        "fecha_limite": "2026-02-01",
        "ubicacion": "Ubicacion de prueba",
        "estado": "disponible",
        "observaciones": "Creada por la coleccion de pruebas"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });