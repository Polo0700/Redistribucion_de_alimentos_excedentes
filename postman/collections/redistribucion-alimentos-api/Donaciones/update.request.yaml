$kind: http-request
name: 'Actualizar donacion'
method: PUT
url: '{{baseUrl}}/donaciones/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fecha_limite": "2026-01-20",
      "id_usuario": "1",
      "fecha_donacion": "2026-01-10",
      "estado": "pendiente",
      "ubicacion": "Bodega central",
      "observaciones": "Creada por la coleccion de pruebas"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });