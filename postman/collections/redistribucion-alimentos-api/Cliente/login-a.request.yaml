$kind: http-request
name: 'Login cliente A (emite el token)'
method: POST
url: '{{baseUrlCliente}}/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "correo": "cliente.a@test.com",
      "password": "12345678"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login 200: devuelve token y datos del cliente", function () {
          const json = pm.response.json();
          pm.expect(pm.response.code).to.eql(200);
          pm.expect(json).to.have.property("token");
          pm.expect(json.usuario).to.have.property("correo", "cliente.a@test.com");
      });
      // Guarda el token del cliente A para los siguientes requests (escenario de propiedad).
      pm.collectionVariables.set("tokenClienteA", pm.response.json().token);
      pm.collectionVariables.set("idUsuarioA", String(pm.response.json().usuario.id));
