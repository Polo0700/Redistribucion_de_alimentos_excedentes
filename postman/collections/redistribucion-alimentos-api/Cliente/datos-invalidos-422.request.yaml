$kind: http-request
name: 'Crear registro sin datos -> 422'
method: POST
url: '{{baseUrlCliente}}/mis-registros'
order: 13000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "direccion_entrega": "",
      "id_alimento": "no-es-un-id",
      "cantidad": -5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Validacion fallida: responde 422 Unprocessable Entity", function () {
          pm.response.to.have.status(422);
      });
      pm.test("Devuelve los errores por campo", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("errors");
          pm.expect(json.errors).to.have.property("direccion_entrega");
          pm.expect(json.errors).to.have.property("id_alimento");
          pm.expect(json.errors).to.have.property("cantidad");
      });
