$kind: http-request
name: 'Registrar cliente A (emite su token)'
method: POST
url: '{{baseUrlCliente}}/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana",
      "apellido": "Perez",
      "correo": "cliente.a@test.com",
      "telefono": "3311223344",
      "direccion": "Calle Uno 123",
      "password": "12345678"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Registro 201: rol Cliente asignado automaticamente y token Sanctum", function () {
          const json = pm.response.json();
          pm.expect(pm.response.code).to.eql(201);
          pm.expect(json.usuario).to.have.property("rol", "Cliente");
          pm.expect(json).to.have.property("token");
      });
      // Si responde 422 es porque el correo ya existe: corre 'Login cliente A'.
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.collectionVariables.set("tokenClienteA", json.token);
          pm.collectionVariables.set("idUsuarioA", String(json.usuario.id));
      }
