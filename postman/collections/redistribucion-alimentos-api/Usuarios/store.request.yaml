$kind: http-request
name: 'Crear usuario'
method: POST
url: '{{baseUrl}}/usuarios'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "id_rol": 1,
        "nombre": "Usuario",
        "apellido": "De prueba",
        "correo": "usuario.prueba@example.com",
        "telefono": "70000000",
        "direccion": "Direccion de prueba",
        "fecha_registro": "2026-01-01",
        "estado": "1"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });