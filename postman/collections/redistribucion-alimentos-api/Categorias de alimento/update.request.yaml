$kind: http-request
name: 'Actualizar categoria de alimento'
method: PUT
url: '{{baseUrl}}/categorias/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Frutas de prueba",
      "estado": "1",
      "descripcion": "Categoria creada por la coleccion de pruebas"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });