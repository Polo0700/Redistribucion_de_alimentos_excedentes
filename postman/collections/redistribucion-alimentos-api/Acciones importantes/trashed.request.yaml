$kind: http-request
name: 'Listar acciones importantes eliminados (papelera)'
method: GET
url: '{{baseUrl}}/acciones-importantes/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'acciones'", function () {
          pm.expect(pm.response.json()).to.have.property('acciones');
      });