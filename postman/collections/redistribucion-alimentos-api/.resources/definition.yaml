$kind: collection
name: 'Redistribucion de Alimentos API'
description: 'API REST del proyecto de redistribucion de alimentos excedentes. Cubre los 9 recursos vigentes y todos los endpoints responden JSON. Autenticacion: corre Login admin primero; el token emitido se guarda en la variable tokenAdmin y viaja como Bearer en todos los requests.'
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:8000/api/v1/admin'
    description: 'Base URL del servidor local (php artisan serve) con el prefijo del area administrativa'
  - key: tokenAdmin
    value: ''
    description: 'Bearer emitido por Login admin (createToken). Vacio hasta correr ese request: sin el, todos los endpoints responden 401.'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{tokenAdmin}}'
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      // Todo cliente de esta API debe pedir JSON: sin esto, Laravel devuelve
      // las paginas de error en HTML y las validaciones como redirect 302.
      if (!pm.request.headers.has("Accept")) {
          pm.request.headers.add({ key: "Accept", value: "application/json" });
      }
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test("Sin errores de servidor (no 5xx)", function () {
          pm.expect(pm.response.code).to.be.below(500);
      });
      pm.test("La respuesta es JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Responde en menos de 2000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });