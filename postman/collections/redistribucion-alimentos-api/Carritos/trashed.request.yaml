$kind: http-request
name: 'Listar carritos eliminados (papelera)'
method: GET
url: '{{baseUrl}}/carritos/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'carritos'", function () {
          pm.expect(pm.response.json()).to.have.property('carritos');
      });