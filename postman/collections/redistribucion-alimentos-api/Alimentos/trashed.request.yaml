$kind: http-request
name: 'Listar alimentos eliminados (papelera)'
method: GET
url: '{{baseUrl}}/alimentos/eliminados'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la papelera en 'alimentos'", function () {
          pm.expect(pm.response.json()).to.have.property('alimentos');
      });