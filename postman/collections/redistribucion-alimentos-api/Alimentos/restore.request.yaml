$kind: http-request
name: 'Restaurar alimento'
method: PATCH
url: '{{baseUrl}}/alimentos/:id/restore'
order: 7000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });