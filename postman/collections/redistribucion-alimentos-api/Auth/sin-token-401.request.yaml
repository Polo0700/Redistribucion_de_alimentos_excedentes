$kind: http-request
name: 'Ruta protegida SIN token -> 401'
method: GET
url: '{{baseUrl}}/administradores'
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Sin Authorization el servidor responde 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
      pm.test("El error viene en JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
