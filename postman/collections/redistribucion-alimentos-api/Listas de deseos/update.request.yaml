$kind: http-request
name: 'Actualizar lista de deseos'
method: PUT
url: '{{baseUrl}}/listas-deseos/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{idPrueba}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Lista de prueba",
      "id_usuario": "1",
      "fecha_creacion": "2026-01-15"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });