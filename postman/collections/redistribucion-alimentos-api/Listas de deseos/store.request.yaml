$kind: http-request
name: 'Crear lista de deseos'
method: POST
url: '{{baseUrl}}/listas-deseos'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Lista de prueba",
      "id_usuario": "1",
      "fecha_creacion": "2026-01-15"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });