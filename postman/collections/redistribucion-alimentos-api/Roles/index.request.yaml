$kind: http-request
name: 'Listar roles (paginado)'
method: GET
url: '{{baseUrl}}/roles'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Devuelve la lista paginada en 'roles'", function () {
          pm.expect(pm.response.json()).to.have.property('roles');
      });