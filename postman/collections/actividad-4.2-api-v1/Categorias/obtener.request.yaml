$kind: http-request
name: 'Obtener categoria por id'
method: GET
url: '{{baseUrlV1}}/categorias/:id'
order: 3000
pathVariables:
  - key: id
    value: '{{categoriaId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve la categoria solicitada", function () {
          var body = pm.response.json();
          pm.expect(body.success).to.eql(true);
          pm.expect(body.data.id_categoria).to.be.a("number");
      });