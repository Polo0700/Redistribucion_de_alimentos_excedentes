$kind: http-request
name: 'Actualizar categoria (PATCH)'
method: PATCH
url: '{{baseUrlV1}}/categorias/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{categoriaId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Solo se cambio la descripcion"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Conserva los campos no enviados", function () {
          var body = pm.response.json();
          pm.expect(body.data.nombre).to.eql("Categoria de prueba 4.2 actualizada");
          pm.expect(body.data.descripcion).to.eql("Solo se cambio la descripcion");
      });