$kind: http-request
name: 'Listar alimentos'
method: GET
url: '{{baseUrlV1}}/alimentos?por_pagina=5'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve la coleccion paginada", function () {
          var body = pm.response.json();
          pm.expect(body.success).to.eql(true);
          pm.expect(body.data.data).to.be.an("array");
      });