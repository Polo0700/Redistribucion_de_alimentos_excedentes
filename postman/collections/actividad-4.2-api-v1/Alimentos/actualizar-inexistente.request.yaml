$kind: http-request
name: 'Actualizar alimento inexistente'
method: PUT
url: '{{baseUrlV1}}/alimentos/999999'
order: 6500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id_categoria": 1,
      "nombre": "Alimento inexistente",
      "descripcion": "Intento de actualizacion",
      "estado": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Devuelve el error estandarizado", function () {
          var body = pm.response.json();
          pm.expect(body.success).to.eql(false);
          pm.expect(body.data).to.eql(null);
          pm.expect(body.errors).to.eql(null);
      });
