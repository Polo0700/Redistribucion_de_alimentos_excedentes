$kind: http-request
name: 'Eliminar alimento'
method: DELETE
url: '{{baseUrlV1}}/alimentos/:id'
order: 10000
pathVariables:
  - key: id
    value: '{{alimentoId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Confirma la eliminacion", function () {
          var body = pm.response.json();
          pm.expect(body.success).to.eql(true);
          pm.expect(body.data).to.eql(null);
      });