$kind: collection
name: 'Actividad 4.2 - API v1'
description: 'CRUD de categorias y alimentos de /api/v1 con respuestas JSON estandarizadas. Todas las solicitudes se ejecutan sin autenticacion.'
variables:
  - key: baseUrlV1
    value: 'http://127.0.0.1:8000/api/v1'
  - key: categoriaId
    value: ''
  - key: categoriaAlimentoId
    value: ''
  - key: alimentoId
    value: ''
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      if (!pm.request.headers.has("Accept")) {
          pm.request.headers.add({ key: "Accept", value: "application/json" });
      }
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test("La respuesta es JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Conserva la estructura success, message, data y errors", function () {
          var body = pm.response.json();
          pm.expect(body).to.have.all.keys("success", "message", "data", "errors");
      });