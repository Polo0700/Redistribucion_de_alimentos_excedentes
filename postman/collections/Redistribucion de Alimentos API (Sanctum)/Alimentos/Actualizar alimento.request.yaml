$kind: http-request
url: "{{baseUrl}}/alimentos/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "{{idPrueba}}"
body:
  type: json
  content: |-
    {
      "nombre": "Manzana de prueba",
      "id_categoria": "1",
      "descripcion": "Alimento creado por la coleccion de pruebas",
      "estado": "1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });
    language: text/javascript
order: 4000
