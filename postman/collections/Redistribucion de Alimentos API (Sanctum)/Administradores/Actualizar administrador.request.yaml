$kind: http-request
url: '{{baseUrl}}/administradores/:id'
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "{{idPrueba}}"
body:
  type: json
  content: |-
    {
      "nombre_completo": "Prueba Admin",
      "username": "admin-prueba",
      "password": "password123",
      "activo": true,
      "nivel": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });
    language: text/javascript
order: 4000
