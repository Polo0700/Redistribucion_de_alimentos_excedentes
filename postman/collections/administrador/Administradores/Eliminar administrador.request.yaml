$kind: http-request
name: 'Eliminar administrador'
method: DELETE
url: '{{baseUrl}}/administradores/:id'
order: 7000
pathVariables:
  - key: id
    value: '{{idAdministrador}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve message", function () {
          pm.expect(pm.response.json()).to.have.property("message");
      });
