$kind: http-request
name: 'Datos para el formulario de edicion'
method: GET
url: '{{baseUrl}}/administradores/:id/edit'
order: 5000
pathVariables:
  - key: id
    value: '{{idAdministrador}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Responde 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Devuelve el registro y los niveles permitidos", function () {
          var body = pm.response.json();
          pm.expect(body).to.have.property("administrador");
          pm.expect(body).to.have.property("niveles");
      });
